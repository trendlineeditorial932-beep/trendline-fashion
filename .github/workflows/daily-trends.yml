name: Daily trends

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 India time, every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh headlines
        run: python scripts/fetch_trends.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "trendline-bot"
          git config user.email "trendline-bot@users.noreply.github.com"
          git add data/trends.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update daily trends"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
